[package]
name = "kye-app"
description = "KnowYourEgk desktop app (eframe/egui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "knowyouregk"
path = "src/main.rs"

[dependencies]
kye-apdu.workspace = true
kye-transport = { workspace = true, features = ["pcsc"] }
kye-pace.workspace = true
kye-egk.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
egui_extras = { version = "0.35", default-features = false, features = ["svg"] }
zeroize = "1"
rfd = "0.17"
printpdf = { version = "0.12", default-features = false }
serde_json = "1"
fluent-bundle = "0.16"
unic-langid = { version = "0.9", features = ["macros"] }
sys-locale = "0.3"

[dev-dependencies]
fluent-syntax = "0.12"
egui_kittest = { version = "0.35", features = ["wgpu", "snapshot"] }

[lints]
workspace = true
